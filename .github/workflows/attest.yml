name: attest

# Signs the build provenance of build.yml's packages, which users check with
# gh attestation verify FILE --repo OWNER/REPO \
#   --signer-workflow blueberrypieos/workflows/.github/workflows/attest.yml
# The calling job must grant contents: read, id-token: write, attestations:
# write and artifact-metadata: write, and run only on a push of the default
# branch or of a tag.
on:
  workflow_call:
    inputs:
      artifact:
        description: build.yml's artifact output
        type: string
        required: true

permissions:
  contents: read

jobs:
  attest:
    if: >-
      github.event_name == 'push' &&
      (github.ref_type == 'tag' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: dist/

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
